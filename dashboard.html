<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pastel Clay - Time Tracker</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap');

    :root {
      --bg-color: #f3e8ff;          /* Soft Lavender */
      --card-pink: #fcedf7;         /* Light Pink */
      --card-green: #e2f0d9;        /* Soft Mint */
      --card-blue: #e0f2fe;         /* Sky Blue */
      --card-yellow: #fef3c7;       /* Pastel Yellow */
      --btn-coral: #ffd6cc;         /* Coral Accent */
      --text-color: #5c4b69;        /* Deep Pastel Purple/Gray */
      --danger-color: #ffd2d2;      /* Light Red */
      --danger-text: #d9534f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      min-height: 100vh;
      color: var(--text-color);
      display: flex;
    }

    .clay-box {
      position: relative;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 
        10px 10px 20px rgba(185, 155, 205, 0.4),
        inset -6px -6px 12px rgba(220, 180, 210, 0.5),
        inset 6px 6px 12px rgba(255, 255, 255, 0.85);
    }

    .clay-box::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: inherit;
      filter: url('#rough-clay-filter');
      opacity: 0.22;
      pointer-events: none;
      z-index: 1;
    }

    .clay-box > * {
      position: relative;
      z-index: 2;
    }

    .sidebar {
      width: 250px;
      margin: 1.5rem;
      padding: 2rem 1.5rem;
      background-color: var(--card-pink);
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 600;
      text-align: center;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .nav-item {
      padding: 0.8rem 1.2rem;
      border-radius: 18px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .nav-item.active, .nav-item:hover {
      background-color: var(--card-green);
      box-shadow: 
        inset 3px 3px 6px rgba(160, 190, 150, 0.5),
        inset -3px -3px 6px rgba(255, 255, 255, 0.8);
    }

    .main-content {
      flex: 1;
      padding: 1.5rem 1.5rem 1.5rem 0;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .top-bar {
      background-color: var(--card-pink);
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background-color: var(--btn-coral);
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 600;
      box-shadow: 
        inset -3px -3px 6px rgba(225, 140, 125, 0.6),
        inset 3px 3px 6px rgba(255, 255, 255, 0.8);
    }

    .logout-btn {
      color: var(--danger-text);
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 600;
    }

    /* Clock-in Hero Section */
    .timecard-section {
      background-color: var(--card-blue);
      padding: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .live-clock-container h2 {
      font-size: 2.2rem;
      margin-bottom: 0.2rem;
    }

    .status-badge {
      display: inline-block;
      padding: 0.4rem 1rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      margin-top: 0.5rem;
      background-color: var(--danger-color);
      color: var(--danger-text);
    }

    .status-badge.working {
      background-color: var(--card-green);
      color: #3b7a30;
    }

    .action-btn {
      padding: 1rem 2.5rem;
      font-size: 1.2rem;
      font-weight: 600;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      color: var(--text-color);
      background-color: var(--card-green);
      box-shadow: 
        6px 6px 12px rgba(160, 190, 150, 0.5),
        inset -4px -4px 8px rgba(160, 190, 150, 0.6),
        inset 4px 4px 8px rgba(255, 255, 255, 0.9);
      transition: transform 0.15s ease;
    }

    .action-btn.clocked-in {
      background-color: var(--btn-coral);
      box-shadow: 
        6px 6px 12px rgba(215, 150, 135, 0.45),
        inset -4px -4px 8px rgba(225, 140, 125, 0.65),
        inset 4px 4px 8px rgba(255, 255, 255, 0.9);
    }

    .action-btn:hover {
      transform: translateY(-2px);
    }

    /* Attendance History Table */
    .history-section {
      background-color: var(--card-pink);
      padding: 2rem;
      flex: 1;
    }

    .history-section h2 {
      margin-bottom: 1.2rem;
    }

    .logs-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 0.6rem;
    }

    .logs-table th {
      text-align: left;
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .logs-table td {
      background-color: var(--bg-color);
      padding: 1rem;
      font-weight: 600;
      box-shadow: 
        inset 2px 2px 5px rgba(185, 155, 205, 0.3),
        inset -2px -2px 5px rgba(255, 255, 255, 0.7);
    }

    .logs-table tr td:first-child {
      border-top-left-radius: 15px;
      border-bottom-left-radius: 15px;
    }

    .logs-table tr td:last-child {
      border-top-right-radius: 15px;
      border-bottom-right-radius: 15px;
    }

    .no-records {
      text-align: center;
      padding: 2rem;
      opacity: 0.7;
    }

    .svg-filter { display: none; }
  </style>
</head>
<body>

  <svg class="svg-filter">
    <filter id="rough-clay-filter">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#ffffff" surfaceScale="2" result="light">
        <feDistantLight azimuth="60" elevation="50" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>
  </svg>

  <aside class="sidebar clay-box">
    <div class="brand">TimeTracker</div>
    <ul class="nav-list">
      <li class="nav-item active">Attendance Clock</li>
      <li class="nav-item">My Timesheet</li>
      <li class="nav-item">Settings</li>
    </ul>
  </aside>

  <main class="main-content">
    
    <header class="top-bar clay-box">
      <h1>Worker Attendance</h1>
      <div class="user-profile">
        <span id="userName">User</span>
        <div class="avatar" id="userAvatar">U</div>
        <a id="logoutBtn" class="logout-btn" style="margin-left: 10px;">Log Out</a>
      </div>
    </header>

    <!-- Clocking Interface -->
    <section class="timecard-section clay-box">
      <div class="live-clock-container">
        <h2 id="liveTime">00:00:00 AM</h2>
        <p id="liveDate">Loading date...</p>
        <div id="statusBadge" class="status-badge">Clocked Out</div>
      </div>
      <div>
        <button id="toggleClockBtn" class="action-btn">Clock In</button>
      </div>
    </section>

    <!-- Attendance Logs -->
    <section class="history-section clay-box">
      <h2>Attendance Records</h2>
      <table class="logs-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Arrival Time</th>
            <th>Departure Time</th>
            <th>Total Hours</th>
          </tr>
        </thead>
        <tbody id="logsBody">
          <!-- Dynamic Log Entries -->
        </tbody>
      </table>
      <div id="noRecordsMsg" class="no-records" style="display: none;">No attendance logs found yet.</div>
    </section>

  </main>

  <script>
    let activeUser = null;

    // Load active session
    try {
      const rawData = localStorage.getItem('activeUser');
      if (rawData) activeUser = JSON.parse(rawData);
    } catch (e) {
      activeUser = null;
    }

    // Verify session
    if (activeUser && activeUser.firstName) {
      const firstName = activeUser.firstName;
      const lastName = activeUser.lastName || '';
      document.getElementById('userName').textContent = `${firstName} ${lastName}`.trim();
      
      const firstInitial = firstName.charAt(0).toUpperCase();
      const lastInitial = lastName ? lastName.charAt(0).toUpperCase() : '';
      document.getElementById('userAvatar').textContent = `${firstInitial}${lastInitial}`;
    } else {
      localStorage.removeItem('activeUser');
      window.location.href = 'index.html';
    }

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('activeUser');
      window.location.href = 'index.html';
    });

    // Clock & Attendance Logic
    const liveTimeEl = document.getElementById('liveTime');
    const liveDateEl = document.getElementById('liveDate');
    const toggleClockBtn = document.getElementById('toggleClockBtn');
    const statusBadge = document.getElementById('statusBadge');
    const logsBody = document.getElementById('logsBody');
    const noRecordsMsg = document.getElementById('noRecordsMsg');

    const storageKeyLogs = `logs_${activeUser.email}`;
    const storageKeyShift = `shift_${activeUser.email}`;

    function updateLiveClock() {
      const now = new Date();
      liveTimeEl.textContent = now.toLocaleTimeString();
      liveDateEl.textContent = now.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }
    setInterval(updateLiveClock, 1000);
    updateLiveClock();

    function getLogs() {
      return JSON.parse(localStorage.getItem(storageKeyLogs)) || [];
    }

    function saveLogs(logs) {
      localStorage.setItem(storageKeyLogs, JSON.stringify(logs));
    }

    function renderLogs() {
      const logs = getLogs();
      logsBody.innerHTML = '';

      if (logs.length === 0) {
        noRecordsMsg.style.display = 'block';
        return;
      }

      noRecordsMsg.style.display = 'none';
      logs.slice().reverse().forEach(log => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${log.date}</td>
          <td>${log.arrival}</td>
          <td>${log.departure}</td>
          <td>${log.duration}</td>
        `;
        logsBody.appendChild(row);
      });
    }

    function updateShiftUI() {
      const activeShift = localStorage.getItem(storageKeyShift);
      if (activeShift) {
        const shiftData = JSON.parse(activeShift);
        statusBadge.textContent = `Clocked In (${shiftData.arrival})`;
        statusBadge.classList.add('working');
        toggleClockBtn.textContent = 'Clock Out';
        toggleClockBtn.classList.add('clocked-in');
      } else {
        statusBadge.textContent = 'Clocked Out';
        statusBadge.classList.remove('working');
        toggleClockBtn.textContent = 'Clock In';
        toggleClockBtn.classList.remove('clocked-in');
      }
    }

    toggleClockBtn.addEventListener('click', () => {
      const activeShift = localStorage.getItem(storageKeyShift);
      const now = new Date();

      if (!activeShift) {
        // CLOCK IN: Save active start time
        const shiftData = {
          startTimeIso: now.toISOString(),
          date: now.toLocaleDateString(),
          arrival: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };
        localStorage.setItem(storageKeyShift, JSON.stringify(shiftData));
      } else {
        // CLOCK OUT: Calculate time worked and store log
        const shiftData = JSON.parse(activeShift);
        const startTime = new Date(shiftData.startTimeIso);
        const departureTime = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const diffMs = now - startTime;
        const totalMinutes = Math.floor(diffMs / (1000 * 60));
        const hrs = Math.floor(totalMinutes / 60);
        const mins = totalMinutes % 60;
        const durationStr = `${hrs}h ${mins}m`;

        const newLog = {
          date: shiftData.date,
          arrival: shiftData.arrival,
          departure: departureTime,
          duration: durationStr
        };

        const logs = getLogs();
        logs.push(newLog);
        saveLogs(logs);

        localStorage.removeItem(storageKeyShift);
      }

      updateShiftUI();
      renderLogs();
    });

    // Initial load
    updateShiftUI();
    renderLogs();
  </script>

</body>
</html>
