<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimeTracker - Sign In</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

    :root {
      --bg-color: #f4f2ee;          /* Warm Linen */
      --card-bg: #ffffff;           /* Pure White */
      --primary: #1b2a4a;           /* Executive Deep Navy */
      --primary-hover: #111c33;     
      --accent: #b8860b;            /* Classic Gold / Bronze */
      --accent-light: #faf6ed;      
      --text: #1c1917;              /* Deep Charcoal */
      --text-muted: #78716c;        
      --border: #e2dfd7;            
      --danger: #b91c1c;            /* Classic Crimson */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text);
      padding: 2rem 1rem;
    }

    .classic-card {
      background-color: var(--card-bg);
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 480px;
      border-radius: 8px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px rgba(27, 42, 74, 0.06);
      border-top: 4px solid var(--accent);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: var(--primary);
      letter-spacing: -0.5px;
    }

    .brand-header p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 0.3rem;
    }

    .tab-container {
      display: flex;
      border-bottom: 2px solid var(--border);
      margin-bottom: 1.8rem;
    }

    .tab-btn {
      flex: 1;
      padding: 0.75rem;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .tab-btn.active {
      color: var(--primary);
    }

    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 2px;
      background-color: var(--accent);
    }

    .alert-msg {
      display: none;
      padding: 0.75rem 1rem;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: var(--danger);
    }

    .auth-form {
      display: none;
    }

    .auth-form.active {
      display: block;
    }

    .form-row {
      display: flex;
      gap: 1rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
      text-align: left;
      flex: 1;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .classic-input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      outline: none;
      background-color: #fafafa;
      border-radius: 4px;
      font-size: 0.95rem;
      color: var(--text);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .classic-input:focus {
      border-color: var(--accent);
      background-color: var(--card-bg);
      box-shadow: 0 0 0 3px rgba(184, 134, 11, 0.12);
    }

    .classic-button {
      width: 100%;
      padding: 0.85rem;
      border: none;
      background-color: var(--primary);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 0.5rem;
      letter-spacing: 0.5px;
      transition: background-color 0.2s ease;
    }

    .classic-button:hover {
      background-color: var(--primary-hover);
    }

    .toggle-text {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
    }

    .toggle-text a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    .toggle-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="classic-card">
    <div class="brand-header">
      <h1>TIMETRACKER</h1>
      <p>Workforce Attendance Management</p>
    </div>
    
    <div class="tab-container">
      <button type="button" class="tab-btn active" id="loginTab">Sign In</button>
      <button type="button" class="tab-btn" id="signupTab">Register</button>
    </div>

    <div id="alertBox" class="alert-msg"></div>

    <!-- LOG IN FORM -->
    <form id="loginForm" class="auth-form active">
      <div class="form-group">
        <label for="login-email">Email Address</label>
        <input type="email" id="login-email" class="classic-input" placeholder="name@company.com" required>
      </div>
      
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" class="classic-input" placeholder="••••••••" required>
      </div>

      <button type="submit" class="classic-button">Sign In to Account</button>

      <p class="toggle-text">
        Need an account? <a id="gotoSignup">Register here</a>
      </p>
    </form>

    <!-- SIGN UP FORM -->
    <form id="signupForm" class="auth-form">
      <div class="form-row">
        <div class="form-group">
          <label for="first-name">First Name</label>
          <input type="text" id="first-name" class="classic-input" placeholder="John" required>
        </div>
        <div class="form-group">
          <label for="last-name">Last Name</label>
          <input type="text" id="last-name" class="classic-input" placeholder="Doe" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" class="classic-input" placeholder="+1 234 567 890" required>
        </div>
        <div class="form-group">
          <label for="signup-email">Email Address</label>
          <input type="email" id="signup-email" class="classic-input" placeholder="john@company.com" required>
        </div>
      </div>

      <div class="form-group">
        <label for="address">Address</label>
        <input type="text" id="address" class="classic-input" placeholder="123 Corporate Ave" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" class="classic-input" placeholder="••••••••" required>
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" class="classic-input" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="classic-button">Create Account</button>

      <p class="toggle-text">
        Already registered? <a id="gotoLogin">Sign in here</a>
      </p>
    </form>
  </div>

  <script>
    try {
      const activeSession = JSON.parse(localStorage.getItem('activeUser'));
      if (activeSession && activeSession.email && activeSession.firstName) {
        window.location.href = 'dashboard.html';
      }
    } catch (e) {
      localStorage.removeItem('activeUser');
    }

    const loginTab = document.getElementById('loginTab');
    const signupTab = document.getElementById('signupTab');
    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');
    const gotoSignup = document.getElementById('gotoSignup');
    const gotoLogin = document.getElementById('gotoLogin');
    const alertBox = document.getElementById('alertBox');

    function hideAlert() {
      alertBox.style.display = 'none';
      alertBox.innerText = '';
    }

    function showAlert(msg) {
      alertBox.innerText = msg;
      alertBox.style.display = 'block';
    }

    function showLogin() {
      hideAlert();
      loginTab.classList.add('active');
      signupTab.classList.remove('active');
      loginForm.classList.add('active');
      signupForm.classList.remove('active');
    }

    function showSignup() {
      hideAlert();
      signupTab.classList.add('active');
      loginTab.classList.remove('active');
      signupForm.classList.add('active');
      loginForm.classList.remove('active');
    }

    loginTab.addEventListener('click', showLogin);
    signupTab.addEventListener('click', showSignup);
    gotoSignup.addEventListener('click', showSignup);
    gotoLogin.addEventListener('click', showLogin);

    // SIGN UP LOGIC
    signupForm.addEventListener('submit', (e) => {
      e.preventDefault();
      hideAlert();

      const email = document.getElementById('signup-email').value.toLowerCase().trim();
      const password = document.getElementById('signup-password').value;
      const confirmPass = document.getElementById('confirm-password').value;
      const firstName = document.getElementById('first-name').value.trim();
      const lastName = document.getElementById('last-name').value.trim();

      if (password !== confirmPass) {
        showAlert("Passwords do not match.");
        return;
      }

      const userData = { email, password, firstName, lastName };
      localStorage.setItem(`user_${email}`, JSON.stringify(userData));
      localStorage.setItem('activeUser', JSON.stringify(userData));
      window.location.href = 'dashboard.html';
    });

    // LOG IN LOGIC
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      hideAlert();

      const email = document.getElementById('login-email').value.toLowerCase().trim();
      const password = document.getElementById('login-password').value;
      const storedUser = localStorage.getItem(`user_${email}`);

      if (!storedUser) {
        showAlert("No account found with this email. Please register first.");
        return;
      }

      let userData;
      try {
        userData = JSON.parse(storedUser);
      } catch(err) {
        showAlert("Account data error. Please register again.");
        return;
      }

      if (userData.password !== password) {
        showAlert("Incorrect password. Please try again.");
        return;
      }

      localStorage.setItem('activeUser', JSON.stringify(userData));
      window.location.href = 'dashboard.html';
    });
  </script>

</body>
</html>
