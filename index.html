<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pastel Clay Auth</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap');

    :root {
      --bg-color: #f3e8ff;          /* Soft Lavender */
      --card-bg: #fcedf7;           /* Light Pastel Pink */
      --input-bg: #e2f0d9;          /* Soft Mint Green */
      --btn-bg: #ffd6cc;            /* Soft Pastel Coral */
      --text-color: #5c4b69;        /* Deep Pastel Purple/Gray */
      --error-color: #d9534f;       /* Soft Red */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-color);
      padding: 2rem 1rem;
    }

    .clay-card {
      background-color: var(--card-bg);
      padding: 2.5rem;
      width: 100%;
      max-width: 460px;
      border-radius: 35px;
      position: relative;
      overflow: hidden;
      
      box-shadow: 
        12px 12px 24px rgba(185, 155, 205, 0.45),
        inset -8px -8px 16px rgba(220, 180, 210, 0.65),
        inset 8px 8px 16px rgba(255, 255, 255, 0.9);
      
      text-align: center;
    }

    .clay-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: inherit;
      filter: url('#rough-clay-filter');
      opacity: 0.25;
      pointer-events: none;
      z-index: 1;
    }

    .clay-card > * {
      position: relative;
      z-index: 2;
    }

    .tab-container {
      display: flex;
      background-color: rgba(255, 255, 255, 0.3);
      padding: 6px;
      border-radius: 20px;
      margin-bottom: 1.5rem;
      box-shadow: inset 2px 2px 5px rgba(185, 155, 205, 0.2);
    }

    .tab-btn {
      flex: 1;
      padding: 0.6rem;
      border: none;
      background: transparent;
      color: var(--text-color);
      font-weight: 600;
      font-size: 1rem;
      border-radius: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background-color: var(--btn-bg);
      box-shadow: 
        3px 3px 6px rgba(215, 150, 135, 0.3),
        inset -2px -2px 4px rgba(225, 140, 125, 0.4),
        inset 2px 2px 4px rgba(255, 255, 255, 0.8);
    }

    .clay-card h2 {
      font-size: 2rem;
      margin-bottom: 0.3rem;
    }

    .clay-card p.subtitle {
      font-size: 0.95rem;
      margin-bottom: 1.2rem;
      opacity: 0.85;
    }

    .alert-msg {
      display: none;
      padding: 0.6rem 1rem;
      border-radius: 15px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1rem;
      background-color: #ffd2d2;
      color: var(--error-color);
      box-shadow: inset 2px 2px 4px rgba(217, 83, 79, 0.2);
    }

    .auth-form {
      display: none;
    }

    .auth-form.active {
      display: block;
    }

    .form-row {
      display: flex;
      gap: 1rem;
    }

    .form-group {
      margin-bottom: 1.2rem;
      text-align: left;
      flex: 1;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      margin-left: 0.5rem;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .clay-input {
      width: 100%;
      padding: 0.8rem 1.1rem;
      border: none;
      outline: none;
      background-color: var(--input-bg);
      border-radius: 20px;
      font-size: 0.95rem;
      color: var(--text-color);
      
      box-shadow: 
        inset 4px 4px 8px rgba(160, 190, 150, 0.55),
        inset -4px -4px 8px rgba(255, 255, 255, 0.85);
      
      transition: all 0.2s ease;
    }

    .clay-input:focus {
      outline: 2px solid #b5d8a6;
    }

    .clay-button {
      width: 100%;
      padding: 0.9rem;
      border: none;
      background-color: var(--btn-bg);
      color: var(--text-color);
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 25px;
      cursor: pointer;
      margin-top: 0.5rem;
      
      box-shadow: 
        6px 6px 12px rgba(215, 150, 135, 0.45),
        inset -5px -5px 10px rgba(225, 140, 125, 0.65),
        inset 5px 5px 10px rgba(255, 255, 255, 0.9);
      
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .clay-button:hover {
      transform: translateY(-2px);
    }

    .clay-button:active {
      transform: translateY(2px);
      box-shadow: 
        2px 2px 5px rgba(215, 150, 135, 0.45),
        inset -2px -2px 5px rgba(225, 140, 125, 0.65),
        inset 2px 2px 5px rgba(255, 255, 255, 0.9);
    }

    .toggle-text {
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: var(--text-color);
    }

    .toggle-text a {
      color: #7b5294;
      font-weight: 600;
      text-decoration: underline;
      cursor: pointer;
    }

    .svg-filter { display: none; }
  </style>
</head>
<body>

  <svg class="svg-filter">
    <filter id="rough-clay-filter">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#ffffff" surfaceScale="2" result="light">
        <feDistantLight azimuth="60" elevation="50" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>
  </svg>

  <div class="clay-card">
    
    <div class="tab-container">
      <button type="button" class="tab-btn active" id="loginTab">Log In</button>
      <button type="button" class="tab-btn" id="signupTab">Sign Up</button>
    </div>

    <div id="alertBox" class="alert-msg"></div>

    <!-- LOG IN FORM -->
    <form id="loginForm" class="auth-form active">
      <h2>Welcome Back!</h2>
      <p class="subtitle">Please enter your details to log in</p>

      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" class="clay-input" placeholder="hello@example.com" required>
      </div>
      
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" class="clay-input" placeholder="••••••••" required>
      </div>

      <button type="submit" class="clay-button">Log In</button>

      <p class="toggle-text">
        Don't have an account yet? <a id="gotoSignup">Sign up here</a>
      </p>
    </form>

    <!-- SIGN UP FORM -->
    <form id="signupForm" class="auth-form">
      <h2>Create Account</h2>
      <p class="subtitle">Please fill out your details to sign up</p>

      <div class="form-row">
        <div class="form-group">
          <label for="first-name">First Name</label>
          <input type="text" id="first-name" class="clay-input" placeholder="Jane" required>
        </div>
        <div class="form-group">
          <label for="last-name">Last Name</label>
          <input type="text" id="last-name" class="clay-input" placeholder="Doe" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" class="clay-input" placeholder="+1 234 567 890" required>
        </div>
        <div class="form-group">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" class="clay-input" placeholder="jane@example.com" required>
        </div>
      </div>

      <div class="form-group">
        <label for="address">Address</label>
        <input type="text" id="address" class="clay-input" placeholder="123 Pastel St, Claytown" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" class="clay-input" placeholder="••••••••" required>
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" class="clay-input" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="clay-button">Sign Up</button>

      <p class="toggle-text">
        Log in if you already have an account <a id="gotoLogin">here</a>
      </p>
    </form>

  </div>

  <script>
    // AUTO-LOGIN CHECK: Safe check prevents redirect loops
    try {
      const activeSession = JSON.parse(localStorage.getItem('activeUser'));
      if (activeSession && activeSession.email && activeSession.firstName) {
        window.location.href = 'dashboard.html';
      }
    } catch (e) {
      localStorage.removeItem('activeUser');
    }

    const loginTab = document.getElementById('loginTab');
    const signupTab = document.getElementById('signupTab');
    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');
    const gotoSignup = document.getElementById('gotoSignup');
    const gotoLogin = document.getElementById('gotoLogin');
    const alertBox = document.getElementById('alertBox');

    function hideAlert() {
      alertBox.style.display = 'none';
      alertBox.innerText = '';
    }

    function showAlert(msg) {
      alertBox.innerText = msg;
      alertBox.style.display = 'block';
    }

    function showLogin() {
      hideAlert();
      loginTab.classList.add('active');
      signupTab.classList.remove('active');
      loginForm.classList.add('active');
      signupForm.classList.remove('active');
    }

    function showSignup() {
      hideAlert();
      signupTab.classList.add('active');
      loginTab.classList.remove('active');
      signupForm.classList.add('active');
      loginForm.classList.remove('active');
    }

    loginTab.addEventListener('click', showLogin);
    signupTab.addEventListener('click', showSignup);
    gotoSignup.addEventListener('click', showSignup);
    gotoLogin.addEventListener('click', showLogin);

    // SIGN UP LOGIC
    signupForm.addEventListener('submit', (e) => {
      e.preventDefault();
      hideAlert();

      const email = document.getElementById('signup-email').value.toLowerCase().trim();
      const password = document.getElementById('signup-password').value;
      const confirmPass = document.getElementById('confirm-password').value;
      const firstName = document.getElementById('first-name').value.trim();
      const lastName = document.getElementById('last-name').value.trim();

      if (password !== confirmPass) {
        showAlert("Passwords do not match!");
        return;
      }

      const userData = { email, password, firstName, lastName };
      
      localStorage.setItem(`user_${email}`, JSON.stringify(userData));
      localStorage.setItem('activeUser', JSON.stringify(userData));

      window.location.href = 'dashboard.html';
    });

    // LOG IN LOGIC
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      hideAlert();

      const email = document.getElementById('login-email').value.toLowerCase().trim();
      const password = document.getElementById('login-password').value;

      const storedUser = localStorage.getItem(`user_${email}`);

      if (!storedUser) {
        showAlert("No account found with this email. Please sign up first!");
        return;
      }

      let userData;
      try {
        userData = JSON.parse(storedUser);
      } catch(err) {
        showAlert("Account data corrupted. Please sign up again.");
        return;
      }

      if (userData.password !== password) {
        showAlert("Incorrect password. Please try again!");
        return;
      }

      localStorage.setItem('activeUser', JSON.stringify(userData));
      window.location.href = 'dashboard.html';
    });
  </script>

</body>
</html>
